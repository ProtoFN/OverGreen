name: Modrinth

on:
  push:
    tags: ["v[0-9]*"]

jobs:
  modrinth:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 25
    - name: Modrinth
      run: ./gradlew modrinth
      env:
        MODRINTH_TOKEN: "${{ secrets.MODRINTH_TOKEN }}"
